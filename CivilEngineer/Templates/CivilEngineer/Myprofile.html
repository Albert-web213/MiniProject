<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Civil Engineer Profile</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #1f2937, #374151);
            font-family: 'Segoe UI', sans-serif;
            color: #f3f4f6;
        }

        .profile-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .profile-card {
            background: #111827;
            width: 100%;
            max-width: 900px;
            border-radius: 15px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            border-top: 6px solid #f59e0b;
            overflow: hidden;
        }

        .profile-header {
            background: #0f172a;
            padding: 30px;
            text-align: center;
            border-bottom: 1px solid #374151;
        }

        .profile-header img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #f59e0b;
            margin-bottom: 15px;
        }

        .profile-header h4 {
            margin: 0;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .profile-body {
            padding: 40px;
        }

        .info-row {
            padding: 15px 0;
            border-bottom: 1px solid #374151;
        }

        .info-label {
            color: #9ca3af;
            font-weight: 500;
        }

        .info-value {
            font-weight: 600;
        }

        .btn-engineer {
            background: #f59e0b;
            color: #111827;
            font-weight: bold;
            border: none;
        }

        .btn-engineer:hover {
            background: #d97706;
            color: white;
        }

        .btn-outline-engineer {
            border: 1px solid #f59e0b;
            color: #f59e0b;
        }

        .btn-outline-engineer:hover {
            background: #f59e0b;
            color: #111827;
        }
    </style>
</head>

<body>

<div class="profile-container">
    <div class="profile-card">

        <!-- Profile Header -->
        <div class="profile-header">
            <!-- IMPORTANT: Use Django media image -->
            <img src="{{ civildata.photo.url }}" alt="Engineer Photo">
            <h4>{{civildata.civileng_name}}</h4>
            <small class="text-warning">Licensed Civil Engineer</small>
        </div>

        <!-- Profile Body -->
        <div class="profile-body">

            <div class="row info-row">
                <div class="col-md-4 info-label">
                    <i class="fa fa-envelope me-2"></i>Email
                </div>
                <div class="col-md-8 info-value">
                    {{civildata.civileng_email}}
                </div>
            </div>

            <div class="row info-row">
                <div class="col-md-4 info-label">
                    <i class="fa fa-phone me-2"></i>Contact
                </div>
                <div class="col-md-8 info-value">
                    {{civildata.civileng_contact}}
                </div>
            </div>

            <div class="row info-row">
                <div class="col-md-4 info-label">
                    <i class="fa fa-location-dot me-2"></i>Address
                </div>
                <div class="col-md-8 info-value">
                    {{civildata.civileng_address}}
                </div>
            </div>

            <div class="row info-row">
                <div class="col-md-4 info-label">
                    <i class="fa fa-map me-2"></i>District
                </div>
                <div class="col-md-8 info-value">
                    {{civildata.place.district.district_name}}
                </div>
            </div>

            <div class="row info-row">
                <div class="col-md-4 info-label">
                    <i class="fa fa-building me-2"></i>Place
                </div>
                <div class="col-md-8 info-value">
                    {{civildata.place.place}}
                </div>
            </div>

            <!-- Buttons -->
            <div class="mt-4 d-flex gap-3">
                <a href="{% url 'CivilEngineer:Editprofile' %}"
                   class="btn btn-engineer">
                    <i class="fa fa-user-pen"></i> Edit Profile
                </a>

                <a href="{% url 'CivilEngineer:ChangePassword' %}"
                   class="btn btn-outline-engineer">
                    <i class="fa fa-lock"></i> Change Password
                </a>
            </div>

        </div>

    </div>
</div>

</body>
</html>

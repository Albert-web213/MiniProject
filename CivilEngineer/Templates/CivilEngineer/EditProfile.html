{% extends 'CivilEngineer/Header.html' %}
{% block content %}

<style>
.page-wrapper {
    min-height: 85vh;
    padding: 90px 0;
    background: linear-gradient(135deg, #1f2937, #374151);
}

.engineer-card {
    background: rgba(17, 24, 39, 0.95);
    border-radius: 16px;
    padding: 45px;
    max-width: 650px;
    margin: auto;
    box-shadow: 0 25px 60px rgba(0,0,0,0.55);
    border-top: 5px solid #f59e0b;
    color: #f3f4f6;
    animation: fadeUp 0.7s ease;
}

@keyframes fadeUp {
    from {opacity:0; transform: translateY(40px);}
    to {opacity:1; transform: translateY(0);}
}

.brand-title {
    text-align: center;
    font-size: 13px;
    letter-spacing: 2px;
    color: #9ca3af;
    margin-bottom: 5px;
}

.engineer-card h3 {
    text-align: center;
    margin-bottom: 35px;
    font-weight: 600;
}

.form-label {
    color: #d1d5db;
    font-weight: 500;
}

.form-control {
    background: #1f2937;
    border: 1px solid #4b5563;
    color: #f3f4f6;
    border-radius: 10px;
}

.form-control:focus {
    border-color: #f59e0b;
    box-shadow: 0 0 0 0.2rem rgba(245, 158, 11, 0.25);
    background: #1f2937;
    color: #fff;
}

.input-group-text {
    background: #374151;
    border: 1px solid #4b5563;
    color: #f59e0b;
}

textarea {
    resize: none;
}

.btn-engineer {
    background: #f59e0b;
    color: #111827;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    padding: 12px;
    transition: 0.3s ease;
}

.btn-engineer:hover {
    background: #d97706;
    color: #fff;
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(0,0,0,0.4);
}
</style>

<div class="page-wrapper">

    <div class="container">
        <div class="engineer-card">

            <div class="brand-title">CIVIL ENGINEER PORTAL</div>
            <h3><i class="fa fa-user-gear"></i> Update Profile</h3>

            <form method="post">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fa fa-user"></i>
                        </span>
                        <input type="text"
                               name="txt_name"
                               class="form-control"
                               value="{{civildata.civileng_name}}"
                               required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fa fa-envelope"></i>
                        </span>
                        <input type="email"
                               name="email"
                               class="form-control"
                               value="{{civildata.civileng_email}}"
                               required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Contact Number</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fa fa-phone"></i>
                        </span>
                        <input type="text"
                               name="contact"
                               class="form-control"
                               value="{{civildata.civileng_contact}}"
                               required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label">Office / Site Address</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fa fa-location-dot"></i>
                        </span>
                        <textarea name="address"
                                  class="form-control"
                                  rows="3"
                                  required>{{civildata.civileng_address}}</textarea>
                    </div>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-engineer">
                        <i class="fa fa-screwdriver-wrench"></i> Update Profile
                    </button>
                </div>

            </form>

        </div>
    </div>

</div>

{% endblock content %}

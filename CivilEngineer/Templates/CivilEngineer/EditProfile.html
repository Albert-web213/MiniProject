<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Civil Engineer - Profile Settings</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #1f2937, #374151);
            font-family: 'Segoe UI', sans-serif;
            color: #f3f4f6;
        }

        .engineer-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .engineer-card {
            background: #111827;
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.6);
            border-top: 5px solid #f59e0b; /* Construction yellow */
        }

        .brand-title {
            text-align: center;
            font-size: 14px;
            letter-spacing: 2px;
            color: #9ca3af;
            margin-bottom: 5px;
        }

        h3 {
            text-align: center;
            margin-bottom: 30px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .form-control {
            background: #1f2937;
            border: 1px solid #4b5563;
            color: #f3f4f6;
        }

        .form-control:focus {
            border-color: #f59e0b;
            box-shadow: 0 0 0 0.2rem rgba(245, 158, 11, 0.25);
            background: #1f2937;
            color: #fff;
        }

        .input-group-text {
            background: #374151;
            border: 1px solid #4b5563;
            color: #f59e0b;
        }

        .btn-engineer {
            background: #f59e0b;
            color: #111827;
            font-weight: bold;
            border: none;
        }

        .btn-engineer:hover {
            background: #d97706;
            color: white;
        }

        textarea {
            resize: none;
        }
    </style>
</head>

<body>

<div class="engineer-container">
    <div class="engineer-card">

        <div class="brand-title">CIVIL ENGINEER PORTAL</div>
        <h3><i class="fa fa-user-gear"></i> Update Profile</h3>

        <form method="post">
            {% csrf_token %}

            <!-- Name -->
            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="fa fa-user"></i>
                    </span>
                    <input type="text"
                           name="txt_name"
                           class="form-control"
                           value="{{userdata.user_name}}"
                           required>
                </div>
            </div>

            <!-- Email -->
            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="fa fa-envelope"></i>
                    </span>
                    <input type="email"
                           name="email"
                           class="form-control"
                           value="{{userdata.user_email}}"
                           required>
                </div>
            </div>

            <!-- Contact -->
            <div class="mb-3">
                <label class="form-label">Contact Number</label>
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="fa fa-phone"></i>
                    </span>
                    <input type="text"
                           name="contact"
                           class="form-control"
                           value="{{userdata.user_contact}}"
                           required>
                </div>
            </div>

            <!-- Address -->
            <div class="mb-4">
                <label class="form-label">Office / Site Address</label>
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="fa fa-location-dot"></i>
                    </span>
                    <textarea name="address"
                              class="form-control"
                              rows="3"
                              required>{{userdata.user_address}}</textarea>
                </div>
            </div>

            <!-- Submit Button -->
            <div class="d-grid">
                <button type="submit" class="btn btn-engineer">
                    <i class="fa fa-screwdriver-wrench"></i> Update Profile
                </button>
            </div>

        </form>

    </div>
</div>

</body>
</html>

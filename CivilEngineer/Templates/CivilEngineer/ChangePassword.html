<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Civil Engineer - Change Password</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #1f2937, #374151);
            font-family: 'Segoe UI', sans-serif;
            color: #f3f4f6;
        }

        .engineer-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .engineer-card {
            background: #111827;
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-top: 5px solid #f59e0b; /* construction yellow */
        }

        .engineer-card h3 {
            text-align: center;
            margin-bottom: 30px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .form-control {
            background: #1f2937;
            border: 1px solid #4b5563;
            color: #f3f4f6;
        }

        .form-control:focus {
            border-color: #f59e0b;
            box-shadow: 0 0 0 0.2rem rgba(245, 158, 11, 0.25);
            background: #1f2937;
            color: #fff;
        }

        .btn-engineer {
            background: #f59e0b;
            color: #111827;
            font-weight: bold;
            border: none;
        }

        .btn-engineer:hover {
            background: #d97706;
            color: white;
        }

        .btn-cancel {
            background: #374151;
            color: white;
            border: 1px solid #6b7280;
        }

        .btn-cancel:hover {
            background: #4b5563;
        }

        .input-group-text {
            background: #374151;
            border: 1px solid #4b5563;
            color: #f59e0b;
        }

        .brand-title {
            text-align: center;
            font-size: 14px;
            letter-spacing: 2px;
            color: #9ca3af;
            margin-bottom: 5px;
        }
    </style>
</head>

<body>

<div class="engineer-container">
    <div class="engineer-card">

        <div class="brand-title">CIVIL ENGINEER PORTAL</div>
        <h3><i class="fa fa-lock"></i> Change Password</h3>

        <form method="post">
            {% csrf_token %}

            <!-- Old Password -->
            <div class="mb-3">
                <label class="form-label">Old Password</label>
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="fa fa-key"></i>
                    </span>
                    <input type="password" name="old_password" class="form-control" required>
                </div>
            </div>

            <!-- New Password -->
            <div class="mb-3">
                <label class="form-label">New Password</label>
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="fa fa-lock"></i>
                    </span>
                    <input type="password" name="new_password" class="form-control" required>
                </div>
            </div>

            <!-- Confirm Password -->
            <div class="mb-4">
                <label class="form-label">Retype Password</label>
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="fa fa-check"></i>
                    </span>
                    <input type="password" name="confirm_password" class="form-control" required>
                </div>
            </div>

            <!-- Buttons -->
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-engineer">
                    <i class="fa fa-wrench"></i> Update Password
                </button>
                <button type="reset" class="btn btn-cancel">
                    Cancel
                </button>
            </div>

        </form>

    </div>
</div>

</body>
</html>

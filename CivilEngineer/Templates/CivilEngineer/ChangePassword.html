{% extends 'CivilEngineer/Header.html' %}
{% block content %}

<style>
.page-wrapper {
    min-height: 85vh;
    padding: 90px 0;
    background: linear-gradient(135deg, #1f2937, #374151);
}

.engineer-card {
    background: rgba(17, 24, 39, 0.9);
    backdrop-filter: blur(12px);
    border-radius: 16px;
    padding: 40px;
    max-width: 520px;
    margin: auto;
    box-shadow: 0 25px 60px rgba(0,0,0,0.5);
    border-top: 5px solid #f59e0b;
    color: #f3f4f6;
    animation: fadeUp 0.7s ease;
}

@keyframes fadeUp {
    from {opacity:0; transform: translateY(40px);}
    to {opacity:1; transform: translateY(0);}
}

.brand-title {
    text-align: center;
    font-size: 13px;
    letter-spacing: 2px;
    color: #9ca3af;
    margin-bottom: 5px;
}

.engineer-card h3 {
    text-align: center;
    margin-bottom: 30px;
    font-weight: 600;
}

.form-label {
    color: #d1d5db;
    font-weight: 500;
}

.form-control {
    background: #1f2937;
    border: 1px solid #4b5563;
    color: #f3f4f6;
    border-radius: 10px;
}

.form-control:focus {
    border-color: #f59e0b;
    box-shadow: 0 0 0 0.2rem rgba(245, 158, 11, 0.25);
    background: #1f2937;
    color: #fff;
}

.input-group-text {
    background: #374151;
    border: 1px solid #4b5563;
    color: #f59e0b;
}

.btn-engineer {
    background: #f59e0b;
    color: #111827;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    padding: 12px;
    transition: 0.3s ease;
}

.btn-engineer:hover {
    background: #d97706;
    color: #fff;
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(0,0,0,0.4);
}

.btn-cancel {
    background: #374151;
    color: white;
    border: 1px solid #6b7280;
    border-radius: 10px;
    padding: 12px;
    transition: 0.3s ease;
}

.btn-cancel:hover {
    background: #4b5563;
}
</style>

<div class="page-wrapper">

    <div class="container">
        <div class="engineer-card">

            <div class="brand-title">CIVIL ENGINEER PORTAL</div>
            <h3><i class="fa fa-lock"></i> Change Password</h3>

            <form method="post">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Old Password</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fa fa-key"></i>
                        </span>
                        <input type="password" name="old_password" class="form-control" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">New Password</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fa fa-lock"></i>
                        </span>
                        <input type="password" name="new_password" class="form-control" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label">Retype Password</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fa fa-check"></i>
                        </span>
                        <input type="password" name="confirm_password" class="form-control" required>
                    </div>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-engineer">
                        <i class="fa fa-wrench"></i> Update Password
                    </button>
                    <button type="reset" class="btn btn-cancel">
                        Cancel
                    </button>
                </div>

            </form>

        </div>
    </div>

</div>

{% endblock content %}

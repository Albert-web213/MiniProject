<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Complaint Module</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Inter', sans-serif;
    background: linear-gradient(-45deg, #4f46e5, #7c3aed, #2563eb, #1e3a8a);
    background-size: 400% 400%;
    animation: gradientMove 12s ease infinite;
    min-height: 100vh;
    padding: 40px;
}

@keyframes gradientMove {
    0% {background-position: 0% 50%;}
    50% {background-position: 100% 50%;}
    100% {background-position: 0% 50%;}
}

.card-custom {
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(18px);
    border-radius: 18px;
    padding: 30px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.25);
    color: white;
    animation: fadeUp 0.8s ease;
}

@keyframes fadeUp {
    from {opacity:0; transform: translateY(40px);}
    to {opacity:1; transform: translateY(0);}
}

.form-group {
    position: relative;
    margin-bottom: 25px;
}

.form-control {
    background: rgba(255,255,255,0.2);
    border: none;
    border-radius: 12px;
    padding: 14px;
    color: white;
}

.form-control:focus {
    background: rgba(255,255,255,0.3);
    box-shadow: 0 0 10px rgba(255,255,255,0.4);
    color: white;
}

.form-group label {
    position: absolute;
    top: 14px;
    left: 15px;
    font-size: 14px;
    transition: 0.3s;
    color: #ddd;
    pointer-events: none;
}

.form-control:focus + label,
.form-control:not(:placeholder-shown) + label {
    top: -8px;
    left: 12px;
    font-size: 12px;
    background: rgba(0,0,0,0.4);
    padding: 2px 6px;
    border-radius: 6px;
}

.btn-modern {
    background: white;
    color: #4f46e5;
    border-radius: 12px;
    padding: 12px;
    font-weight: 600;
    transition: 0.3s;
}

.btn-modern:hover {
    transform: translateY(-3px);
    box-shadow: 0 15px 30px rgba(0,0,0,0.3);
}

.table-custom {
    margin-top: 40px;
    background: rgba(255,255,255,0.1);
    border-radius: 15px;
    overflow: hidden;
    color: white;
}

.table-custom th {
    background: rgba(255,255,255,0.2);
}

.table-custom tr {
    transition: 0.3s;
    animation: rowFade 0.6s ease forwards;
    opacity: 0;
}

.table-custom tr:nth-child(even) {
    background: rgba(255,255,255,0.05);
}

.table-custom tr:hover {
    background: rgba(255,255,255,0.2);
    transform: scale(1.01);
}

@keyframes rowFade {
    to {opacity:1;}
}

.delete-link {
    color: #ff6b6b;
    text-decoration: none;
    font-weight: 500;
}

.delete-link:hover {
    text-decoration: underline;
}

</style>
</head>
<body>

<div class="container">

    <div class="card-custom">

        <h4 class="mb-4">Submit Complaint</h4>

        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <input type="text" name="txt_title" class="form-control" placeholder=" " required>
                <label>Complaint Title</label>
            </div>

            <div class="form-group">
                <input type="text" name="txt_content" class="form-control" placeholder=" " required>
                <label>Complaint Content</label>
            </div>

            <button type="submit" class="btn btn-modern w-100">Submit Complaint</button>

        </form>

    </div>

    <table class="table table-custom mt-5">
        <thead>
            <tr>
                <th>S.No</th>
                <th>Title</th>
                <th>Content</th>
                <th>Date</th>
                <th>Reply</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            {% for i in complaintdata %}
            <tr style="animation-delay: {{forloop.counter0}}00ms;">
                <td>{{forloop.counter}}</td>
                <td>{{i.complaint_title}}</td>
                <td>{{i.complaint_content}}</td>
                <td>{{i.complaint_date}}</td>
                <td>{{i.complaint_reply}}</td>
                <td>
                    <a href="{% url 'User:deletecomplaint' i.id%}" class="delete-link">
                        Delete
                    </a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</div>

</body>
</html>

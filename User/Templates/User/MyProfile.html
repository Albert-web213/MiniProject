<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Inter', sans-serif;
    background: linear-gradient(-45deg, #4f46e5, #7c3aed, #2563eb, #1e40af);
    background-size: 400% 400%;
    animation: gradientMove 14s ease infinite;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

@keyframes gradientMove {
    0% {background-position: 0% 50%;}
    50% {background-position: 100% 50%;}
    100% {background-position: 0% 50%;}
}

.profile-card {
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(18px);
    border-radius: 20px;
    padding: 40px;
    width: 100%;
    max-width: 600px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.25);
    color: white;
    animation: fadeUp 0.8s ease;
}

@keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(40px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.profile-image {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid rgba(255,255,255,0.6);
    margin-bottom: 20px;
}

.profile-title {
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 30px;
    text-align: center;
}

.info-row {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,0.2);
}

.info-label {
    font-weight: 500;
    color: #e5e7eb;
}

.info-value {
    text-align: right;
}

.action-buttons {
    margin-top: 30px;
    display: flex;
    gap: 15px;
}

.btn-modern {
    flex: 1;
    background: white;
    color: #4f46e5;
    border-radius: 12px;
    padding: 10px;
    font-weight: 600;
    text-align: center;
    text-decoration: none;
    transition: 0.3s ease;
}

.btn-modern:hover {
    transform: translateY(-3px);
    box-shadow: 0 15px 30px rgba(0,0,0,0.3);
}

</style>
</head>
<body>

<div class="profile-card text-center">

    <img src="{{userdata.user_photo.url}}" class="profile-image">

    <div class="profile-title">{{userdata.user_name}}</div>

    <div class="info-row">
        <div class="info-label">Email</div>
        <div class="info-value">{{userdata.user_email}}</div>
    </div>

    <div class="info-row">
        <div class="info-label">Contact</div>
        <div class="info-value">{{userdata.user_contact}}</div>
    </div>

    <div class="info-row">
        <div class="info-label">Address</div>
        <div class="info-value">{{userdata.user_address}}</div>
    </div>

    <div class="info-row">
        <div class="info-label">District</div>
        <div class="info-value">{{userdata.place.district.district_name}}</div>
    </div>

    <div class="info-row">
        <div class="info-label">Place</div>
        <div class="info-value">{{userdata.place.place}}</div>
    </div>

    <div class="action-buttons">
        <a href="{% url 'User:Editprofile' %}" class="btn-modern">
            Edit Profile
        </a>
        <a href="{% url 'User:ChangePassword' %}" class="btn-modern">
            Change Password
        </a>
    </div>

</div>

</body>
</html>

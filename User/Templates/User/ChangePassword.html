{% extends 'User/Header.html' %}
{% block content %}

<style>
.page-wrapper {
    min-height: 85vh;
    padding: 80px 0;
    background: linear-gradient(135deg, #4f46e5, #9333ea);
}

.password-card {
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(18px);
    border-radius: 20px;
    padding: 40px;
    max-width: 450px;
    margin: auto;
    box-shadow: 0 30px 60px rgba(0,0,0,0.25);
    color: white;
    animation: fadeUp 0.8s ease;
}

@keyframes fadeUp {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
}

.page-title {
    text-align: center;
    font-weight: 600;
    margin-bottom: 30px;
}

.form-group {
    position: relative;
    margin-bottom: 25px;
}

.form-control {
    border-radius: 12px;
    padding: 14px;
    background: rgba(255,255,255,0.2);
    border: none;
    color: white;
}

.form-control:focus {
    background: rgba(255,255,255,0.3);
    box-shadow: 0 0 10px rgba(255,255,255,0.4);
    color: white;
}

.form-group label {
    position: absolute;
    top: 14px;
    left: 15px;
    font-size: 14px;
    color: #ddd;
    transition: 0.3s;
    pointer-events: none;
}

.form-control:focus + label,
.form-control:not(:placeholder-shown) + label {
    top: -8px;
    left: 12px;
    font-size: 12px;
    background: rgba(0,0,0,0.4);
    padding: 2px 6px;
    border-radius: 6px;
}

.btn-primary {
    background: white;
    color: #4f46e5;
    border-radius: 12px;
    padding: 12px;
    font-weight: 600;
    border: none;
    transition: 0.3s ease;
}

.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 15px 30px rgba(0,0,0,0.3);
}

.btn-secondary {
    border-radius: 12px;
}

.alert-custom {
    background: rgba(255,255,255,0.2);
    padding: 10px;
    border-radius: 10px;
    text-align: center;
    margin-bottom: 20px;
}

.toggle-password {
    position: absolute;
    right: 15px;
    top: 14px;
    cursor: pointer;
    font-size: 14px;
    color: #ddd;
}
</style>

<div class="page-wrapper">

    <div class="password-card">

        <div class="page-title">🔐 Change Password</div>

        {% if msg %}
        <div class="alert-custom">
            {{msg}}
        </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <input type="password" name="old_password" class="form-control" placeholder=" " required>
                <label>Old Password</label>
            </div>

            <div class="form-group">
                <input type="password" id="new_password" name="new_password" class="form-control" placeholder=" " required>
                <label>New Password</label>
                <span class="toggle-password" onclick="togglePassword('new_password')">Show</span>
                <div id="strength" class="mt-1 small"></div>
            </div>

            <div class="form-group">
                <input type="password" id="retype_password" name="retype_password" class="form-control" placeholder=" " required>
                <label>Retype Password</label>
                <span class="toggle-password" onclick="togglePassword('retype_password')">Show</span>
            </div>

            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary">Update Password</button>
                <button type="reset" class="btn btn-secondary">Cancel</button>
            </div>

        </form>

    </div>

</div>

<script>
function togglePassword(id) {
    var field = document.getElementById(id);
    field.type = field.type === "password" ? "text" : "password";
}

document.getElementById("new_password").addEventListener("input", function () {
    var val = this.value;
    var strength = document.getElementById("strength");

    if (val.length < 6) {
        strength.innerHTML = "Weak password";
        strength.style.color = "red";
    } else if (val.match(/[A-Z]/) && val.match(/[0-9]/) && val.length >= 8) {
        strength.innerHTML = "Strong password";
        strength.style.color = "lightgreen";
    } else {
        strength.innerHTML = "Medium strength";
        strength.style.color = "orange";
    }
});
</script>

{% endblock content %}

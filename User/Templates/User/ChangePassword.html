<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Change Password</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #4f46e5, #9333ea);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .password-card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.3);
            color: white;
            animation: slideUp 0.8s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .title {
            font-weight: 700;
            text-align: center;
            margin-bottom: 30px;
        }

        .form-group {
            position: relative;
            margin-bottom: 25px;
        }

        .form-control {
            border-radius: 12px;
            padding: 14px;
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
        }

        .form-control:focus {
            background: rgba(255,255,255,0.3);
            box-shadow: 0 0 10px rgba(255,255,255,0.4);
            color: white;
        }

        .form-group label {
            position: absolute;
            top: 14px;
            left: 15px;
            color: #ddd;
            font-size: 14px;
            transition: 0.3s;
            pointer-events: none;
        }

        .form-control:focus + label,
        .form-control:not(:placeholder-shown) + label {
            top: -8px;
            left: 12px;
            font-size: 12px;
            background: rgba(0,0,0,0.4);
            padding: 2px 6px;
            border-radius: 6px;
        }

        .btn-primary {
            background: white;
            color: #4f46e5;
            border-radius: 12px;
            padding: 12px;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
        }

        .btn-secondary {
            border-radius: 12px;
        }

        .strength {
            font-size: 13px;
            margin-top: 5px;
        }

        .alert-custom {
            background: rgba(255,255,255,0.2);
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 14px;
            cursor: pointer;
            font-size: 14px;
            color: #ddd;
        }

    </style>
</head>
<body>

<div class="password-card">

    <div class="title">🔐 Change Password</div>

    {% if msg %}
    <div class="alert-custom">
        {{msg}}
    </div>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <div class="form-group">
            <input type="password" name="old_password" class="form-control" placeholder=" " required>
            <label>Old Password</label>
        </div>

        <div class="form-group">
            <input type="password" id="new_password" name="new_password" class="form-control" placeholder=" " required>
            <label>New Password</label>
            <span class="toggle-password" onclick="togglePassword('new_password')">Show</span>
            <div id="strength" class="strength"></div>
        </div>

        <div class="form-group">
            <input type="password" id="retype_password" name="retype_password" class="form-control" placeholder=" " required>
            <label>Retype Password</label>
            <span class="toggle-password" onclick="togglePassword('retype_password')">Show</span>
        </div>

        <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary">Update Password</button>
            <button type="reset" class="btn btn-secondary">Cancel</button>
        </div>

    </form>

</div>

</body>
</html>

<script>
function togglePassword(id) {
    var field = document.getElementById(id);
    if (field.type === "password") {
        field.type = "text";
    } else {
        field.type = "password";
    }
}

document.getElementById("new_password").addEventListener("input", function () {
    var val = this.value;
    var strength = document.getElementById("strength");

    if (val.length < 6) {
        strength.innerHTML = "Weak password";
        strength.style.color = "red";
    } else if (val.match(/[A-Z]/) && val.match(/[0-9]/) && val.length >= 8) {
        strength.innerHTML = "Strong password";
        strength.style.color = "lightgreen";
    } else {
        strength.innerHTML = "Medium strength";
        strength.style.color = "orange";
    }
});
</script>

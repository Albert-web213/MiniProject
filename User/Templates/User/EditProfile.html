<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Update Profile</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Inter', sans-serif;
    background: linear-gradient(-45deg, #4f46e5, #7c3aed, #2563eb, #1e40af);
    background-size: 400% 400%;
    animation: gradientMove 14s ease infinite;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

@keyframes gradientMove {
    0% {background-position: 0% 50%;}
    50% {background-position: 100% 50%;}
    100% {background-position: 0% 50%;}
}

.profile-card {
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(18px);
    border-radius: 20px;
    padding: 40px;
    width: 100%;
    max-width: 500px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.25);
    color: white;
    animation: fadeUp 0.8s ease;
}

@keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(40px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.profile-title {
    text-align: center;
    font-weight: 600;
    font-size: 22px;
    margin-bottom: 30px;
}

.form-group {
    position: relative;
    margin-bottom: 25px;
}

.form-control {
    background: rgba(255,255,255,0.2);
    border: none;
    border-radius: 12px;
    padding: 14px;
    color: white;
}

.form-control:focus {
    background: rgba(255,255,255,0.3);
    box-shadow: 0 0 10px rgba(255,255,255,0.4);
    color: white;
}

.form-group label {
    position: absolute;
    top: 14px;
    left: 15px;
    font-size: 14px;
    color: #e5e7eb;
    transition: 0.3s ease;
    pointer-events: none;
}

.form-control:focus + label,
.form-control:not(:placeholder-shown) + label,
textarea:focus + label,
textarea:not(:placeholder-shown) + label {
    top: -8px;
    left: 12px;
    font-size: 12px;
    background: rgba(0,0,0,0.4);
    padding: 2px 6px;
    border-radius: 6px;
}

.btn-modern {
    background: white;
    color: #4f46e5;
    border-radius: 12px;
    padding: 12px;
    font-weight: 600;
    transition: 0.3s ease;
}

.btn-modern:hover {
    transform: translateY(-3px);
    box-shadow: 0 15px 30px rgba(0,0,0,0.3);
}

</style>
</head>
<body>

<div class="profile-card">

    <div class="profile-title">Update Profile</div>

    <form method="post">
        {% csrf_token %}

        <div class="form-group">
            <input type="text" name="txt_name" class="form-control" placeholder=" "
                   value="{{userdata.user_name}}" required>
            <label>Full Name</label>
        </div>

        <div class="form-group">
            <input type="email" name="email" class="form-control" placeholder=" "
                   value="{{userdata.user_email}}" required>
            <label>Email Address</label>
        </div>

        <div class="form-group">
            <input type="text" name="contact" class="form-control" placeholder=" "
                   value="{{userdata.user_contact}}" required>
            <label>Contact Number</label>
        </div>

        <div class="form-group">
            <textarea name="address" rows="3" class="form-control" placeholder=" " required>{{userdata.user_address}}</textarea>
            <label>Address</label>
        </div>

        <button type="submit" class="btn btn-modern w-100">
            Update Profile
        </button>

    </form>

</div>

</body>
</html>

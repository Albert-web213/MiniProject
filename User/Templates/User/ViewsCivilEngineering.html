<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Civil Engineers Directory</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Inter', sans-serif;
    background: linear-gradient(-45deg, #4f46e5, #7c3aed, #2563eb, #1e40af);
    background-size: 400% 400%;
    animation: gradientMove 15s ease infinite;
    min-height: 100vh;
    padding: 40px;
}

@keyframes gradientMove {
    0% {background-position: 0% 50%;}
    50% {background-position: 100% 50%;}
    100% {background-position: 0% 50%;}
}

.directory-card {
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(18px);
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.25);
    color: white;
    animation: fadeUp 0.8s ease;
}

@keyframes fadeUp {
    from {opacity: 0; transform: translateY(40px);}
    to {opacity: 1; transform: translateY(0);}
}

.page-title {
    font-size: 24px;
    font-weight: 600;
    margin-bottom: 25px;
}

.table-custom {
    color: white;
}

.table-custom thead {
    background: rgba(255,255,255,0.2);
}

.table-custom tbody tr {
    transition: 0.3s ease;
}

.table-custom tbody tr:hover {
    background: rgba(255,255,255,0.15);
    transform: scale(1.01);
}

.profile-img {
    width: 70px;
    height: 70px;
    object-fit: cover;
    border-radius: 12px;
    border: 2px solid rgba(255,255,255,0.6);
}

</style>
</head>
<body>

<div class="container">

    <div class="directory-card">

        <div class="page-title">Registered Civil Engineers</div>

        <div class="table-responsive">
            <table class="table table-borderless table-custom align-middle">
                <thead>
                    <tr>
                        <th>Si.No</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Contact</th>
                        <th>Address</th>
                        <th>Photo</th>
                    </tr>
                </thead>
                <tbody>
                    {% for i in civilengdata %}
                    <tr>
                        <td>{{forloop.counter}}</td>
                        <td>{{i.civileng_name}}</td>
                        <td>{{i.civileng_email}}</td>
                        <td>{{i.civileng_contact}}</td>
                        <td>{{i.civileng_address}}</td>
                        <td>
                            <img src="{{i.civileng_photo.url}}" class="profile-img">
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

    </div>

</div>

</body>
</html>

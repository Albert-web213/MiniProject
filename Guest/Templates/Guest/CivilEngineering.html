<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Account</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .register-card {
            background: #ffffff;
            border-radius: 18px;
            padding: 40px;
            width: 100%;
            max-width: 900px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
        }

        .register-title {
            font-weight: 700;
            font-size: 28px;
        }

        .register-subtitle {
            color: #6b7280;
            margin-bottom: 30px;
        }

        .form-control, .form-select {
            border-radius: 10px;
            padding: 12px;
        }

        .form-control:focus, .form-select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 0.2rem rgba(37, 99, 235, 0.15);
        }

        .btn-premium {
            background: #2563eb;
            color: white;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-premium:hover {
            background: #1d4ed8;
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

<div class="register-card">

    <div class="text-center mb-4">
        <div class="register-title">Create Your Account</div>
        <div class="register-subtitle">Join our platform and get started today</div>
    </div>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="row g-4">

            <!-- Personal Details -->
            <div class="col-12 section-title">Personal Information</div>

            <div class="col-md-6">
                <input type="text" name="txt_name" class="form-control" placeholder="Full Name" required>
            </div>

            <div class="col-md-6">
                <input type="email" name="email" class="form-control" placeholder="Email Address" required>
            </div>

            <div class="col-md-6">
                <input type="text" name="txt_contact" class="form-control" placeholder="Contact Number" required>
            </div>

            <div class="col-md-6">
                <input type="password" name="password" class="form-control" placeholder="Create Password" required>
            </div>

            <div class="col-12">
                <textarea name="txt_address" class="form-control" rows="3" placeholder="Full Address" required></textarea>
            </div>

            <!-- Location -->
            <div class="col-12 section-title mt-3">Location Details</div>

            <div class="col-md-6">
                <select name="District" id="District" class="form-select" required>
                    <option value="">Select District</option>
                    {% for i in district %}
                    <option value="{{i.id}}">{{i.district_name}}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-md-6">
                <select name="Place" id="Place" class="form-select" required>
                    <option value="">Select Place</option>
                </select>
            </div>

            <!-- Upload Section -->
            <div class="col-12 section-title mt-3">Verification</div>

            <div class="col-md-6">
                <label class="form-label">Upload Photo</label>
                <input type="file" name="photo" class="form-control" required>
            </div>

            <div class="col-md-6">
                <label class="form-label">Upload ID Proof</label>
                <input type="file" name="txt_proof" class="form-control" required>
            </div>

            <!-- Submit -->
            <div class="col-12 mt-4">
                <button type="submit" class="btn btn-premium w-100">
                    Register Account
                </button>
            </div>

        </div>
    </form>

</div>

</body>
</html>

<!-- jQuery -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

<script>
    $("#District").change(function () {
        var did = $(this).val();
        var ur = "{% url 'Guest:ajaxplace' %}";
        $.ajax({
            url: ur,
            data: { did: did },
            success: function (data) {
                $("#Place").html(data);
            },
        });
    });
</script>

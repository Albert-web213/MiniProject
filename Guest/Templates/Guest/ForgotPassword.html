<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #4f46e5, #9333ea);
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: #fff;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            width: 320px;
        }

        .card h2 {
            margin-bottom: 20px;
            color: #333;
        }

        input[type="email"] {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            margin-bottom: 15px;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        input[type="email"]:focus {
            border-color: #4f46e5;
        }

        input[type="submit"] {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 6px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        input[type="submit"]:hover {
            background: #3730a3;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Forgot Password</h2>
        <form action="" method="post">
            {% csrf_token %}
            <input type="email" name="txt_email" placeholder="Enter your email" required>
            <input type="submit" value="Send OTP">
        </form>
    </div>

    {% if msg %}
    <script>
        alert("OTP is sent to {{msg}}")
        window.location = "{% url 'Guest:otp' %}"
    </script>
    {% endif %}

</body>
</html>

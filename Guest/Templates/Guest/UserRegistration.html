<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Account</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(-45deg, #667eea, #764ba2, #6b73ff, #000dff);
            background-size: 400% 400%;
            animation: gradientMove 12s ease infinite;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating background blobs */
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.5;
            animation: float 10s infinite ease-in-out alternate;
        }

        .blob1 {
            width: 300px;
            height: 300px;
            background: #ff6ec4;
            top: 10%;
            left: 10%;
        }

        .blob2 {
            width: 350px;
            height: 350px;
            background: #7873f5;
            bottom: 10%;
            right: 10%;
        }

        @keyframes float {
            from { transform: translateY(0px); }
            to { transform: translateY(40px); }
        }

        .register-card {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(25px);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 900px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.35);
            color: white;
            animation: fadeInUp 1s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .register-title {
            font-weight: 700;
            font-size: 26px;
            text-align: center;
            margin-bottom: 30px;
        }

        /* Floating Label */
        .form-group {
            position: relative;
        }

        .form-control, .form-select {
            border-radius: 12px;
            padding: 14px 12px;
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
        }

        .form-control:focus, .form-select:focus {
            background: rgba(255,255,255,0.3);
            box-shadow: 0 0 10px rgba(255,255,255,0.4);
            color: white;
        }

        .form-group label {
            position: absolute;
            top: 14px;
            left: 15px;
            font-size: 14px;
            color: #e5e7eb;
            transition: 0.3s ease;
            pointer-events: none;
        }

        .form-control:focus + label,
        .form-control:not(:placeholder-shown) + label,
        .form-select:focus + label {
            top: -8px;
            left: 12px;
            font-size: 12px;
            background: rgba(0,0,0,0.4);
            padding: 2px 6px;
            border-radius: 6px;
        }

        .btn-trendy {
            background: white;
            color: #5b21b6;
            border-radius: 12px;
            padding: 14px;
            font-weight: 600;
            transition: 0.3s ease;
        }

        .btn-trendy:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }

        .file-preview {
            width: 90px;
            height: 90px;
            border-radius: 12px;
            object-fit: cover;
            margin-top: 10px;
            display: none;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

    </style>
</head>
<body>

<div class="blob blob1"></div>
<div class="blob blob2"></div>

<div class="register-card">

    <div class="register-title">Create Your Account ✨</div>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="row g-4">

            <div class="col-md-6 form-group">
                <input type="text" name="txt_name" class="form-control" placeholder=" " required>
                <label>Full Name</label>
            </div>

            <div class="col-md-6 form-group">
                <input type="email" name="email" class="form-control" placeholder=" " required>
                <label>Email Address</label>
            </div>

            <div class="col-md-6 form-group">
                <input type="text" name="txt_contact" class="form-control" placeholder=" " required>
                <label>Contact Number</label>
            </div>

            <div class="col-md-6 form-group">
                <input type="password" name="Password" class="form-control" placeholder=" " required>
                <label>Password</label>
            </div>

            <div class="col-12 form-group">
                <textarea name="Address" class="form-control" rows="3" placeholder=" " required></textarea>
                <label>Address</label>
            </div>

            <div class="col-md-6">
                <select name="District" id="District" class="form-select" required>
                    <option value="">Select District</option>
                    {% for i in district %}
                    <option value="{{i.id}}">{{i.district_name}}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-md-6">
                <select name="Place" id="Place" class="form-select" required>
                    <option value="">Select Place</option>
                </select>
            </div>

            <div class="col-md-6">
                <input type="file" name="file" id="All_file" class="form-control" accept="image/*" required>
                <img id="preview" class="file-preview">
            </div>

            <div class="col-12 mt-4">
                <button type="submit" class="btn btn-trendy w-100">
                    Sign Up Now 🚀
                </button>
            </div>

        </div>
    </form>

</div>

</body>
</html>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

<script>
    // AJAX for place dropdown
    $("#District").change(function () {
        var did = $(this).val();
        var ur = "{% url 'Guest:ajaxplace' %}";
        $.ajax({
            url: ur,
            data: { did: did },
            success: function (data) {
                $("#Place").html(data);
            },
        });
    });

    // Image preview animation
    document.getElementById("All_file").addEventListener("change", function(e) {
        const preview = document.getElementById("preview");
        preview.src = URL.createObjectURL(e.target.files[0]);
        preview.style.display = "block";
    });
</script>
